services:

  application:
    image: kutupai-application:latest
    container_name: kutupai-application
    ports:
      - "8080:8080"
    environment:
      APP_SERVER_PORT: 8080
      ORCHESTRATION_BASE_URL: http://orchestration:8000
      ORCHESTRATION_TIMEOUT_SECONDS: 300
      APP_TEMP_UPLOAD_ROOT_DIR: /app/Storage/files/temp_processing
      APP_MAX_UPLOAD_SIZE_MB: 10
    depends_on:
      - orchestration
    volumes:
      - ./Storage/files:/app/Storage/files

  orchestration:
    image: kutupai-orchestration:latest
    container_name: kutupai-orchestration
    ports:
      - "8000:8000"
    environment:
      ORCHESTRATION_HOST: 0.0.0.0
      ORCHESTRATION_PORT: 8000
      INFERENCE_BASE_URL: http://inference:8080/v1/chat/completions
    depends_on:
      - inference
    volumes:
      - ./Storage/files:/app/Storage/files
      - ./RAG/chroma:/app/RAG/chroma

  inference:
    image: kutupai-inference:latest
    container_name: kutupai-inference
    expose:
      - "8080"
    volumes:
      - ./Inference/models:/models