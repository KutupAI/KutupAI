# =====================================================================
# rag_config.yaml
# الإعدادات العامة لطبقة RAG - المرحلة الأولى (MVP)
# =====================================================================

# ---------------------------------------------------------------------
# مسارات المستندات المصدر (النصوص القانونية)
# ---------------------------------------------------------------------
documents:
  laws_path: "RAG/documents/laws"
  regulations_path: "RAG/documents/regulations"
  internal_docs_path: "RAG/documents/internal_docs"

  # الامتدادات المسموح فهرستها
  allowed_extensions:
    - ".txt"
    - ".md"
    - ".json"

# ---------------------------------------------------------------------
# إعدادات التقطيع (Chunking)
# ---------------------------------------------------------------------
chunking:
  # الوحدة الأساسية للتقطيع: يحترم بنية المادة/الفقرة (madde/fıkra)
  unit: "madde"                # القيم الممكنة لاحقًا: madde | fikra

  # الحد الأقصى لعدد الأحرف داخل الـ chunk الواحد
  # (إذا كانت المادة أطول من هذا الحد، يتم تقسيمها داخليًا)
  max_chunk_size_chars: 1500

  # التداخل بين الأجزاء عند تقسيم مادة طويلة (لتفادي فقدان السياق عند القطع)
  chunk_overlap_chars: 150

# ---------------------------------------------------------------------
# إعدادات الفهرسة (Indexing)
# ---------------------------------------------------------------------
indexing:
  batch_size: 32                # عدد الـ chunks التي تُرسل دفعة واحدة للـ embedding
  reindex_on_update: true       # إعادة فهرسة الملف بالكامل عند أي تعديل عليه

# ---------------------------------------------------------------------
# إعدادات الاسترجاع (Retrieval) - المرحلة الأولى: Top-K بسيط فقط
# ---------------------------------------------------------------------
retrieval:
  default_top_k: 5
  max_top_k: 20

# ---------------------------------------------------------------------
# مسارات ملفات الإعداد الفرعية (مرجع فقط - تُقرأ من ملفاتها الخاصة)
# ---------------------------------------------------------------------
sub_configs:
  embedding_config: "RAG/configuration/embedding_config.py"
  chroma_config: "RAG/configuration/chroma_config.py"

# ---------------------------------------------------------------------
# ملاحظة: لا CUDA في هذه المرحلة - كل شيء يعمل على CPU
# ---------------------------------------------------------------------
runtime:
  device: "cpu"
